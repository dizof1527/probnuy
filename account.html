<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Аккаунт · Расписание БашГАУ</title>
  <link rel="icon" href="./icon-192.png">
  <script defer src="./vendor/supabase-2.119.2.js"></script>
  <script defer src="./supabase-client.js"></script>
  <script defer src="./account.js"></script>
  <style>
    :root{color-scheme:light dark;--bg:#f3f4f6;--panel:#fff;--ink:#171a1f;--muted:#515b68;--line:#d3d9e2;--accent:#244e79;--on-accent:#fff}
    @media(prefers-color-scheme:dark){:root{--bg:#171a1f;--panel:#20252c;--ink:#f1f4f8;--muted:#b2bece;--line:#424b57;--accent:#abc9ef;--on-accent:#141c2a}}
    *{box-sizing:border-box} [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
    header,main{max-width:850px;margin:auto;padding:16px clamp(12px,4vw,24px)}
    header a{color:var(--accent);display:inline-flex;align-items:center;min-height:44px}
    h1{font-size:clamp(26px,5vw,36px);margin:0 0 14px;letter-spacing:-.035em} h2{margin:0;font-size:20px}
    section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(13px,4vw,22px);margin-bottom:14px}
    #authPanel{max-width:480px}
    p{margin:7px 0;color:var(--muted);overflow-wrap:anywhere}
    .buttons,.profile-head,.user{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
    .profile-head,.user{justify-content:space-between}
    .profile-head>div,.user>div{min-width:0;overflow-wrap:anywhere}
    .user{padding:10px 0;border-top:1px solid var(--line)}
    .user p{font-size:13px;margin:2px 0}
    form{display:grid;gap:10px;margin:12px 0 0}
    label{display:grid;gap:5px;font-weight:650}
    input,button,select{min-height:44px;font:inherit;color:inherit;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 12px}
    input,select{width:100%;min-width:0}
    button{justify-self:start;cursor:pointer} button:disabled{opacity:.55;cursor:default}
    button[aria-pressed=true],.primary{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    #status{margin:0 0 12px;overflow-wrap:anywhere} #status[data-error=true]{font-weight:700}
    #accountSearch{grid-template-columns:minmax(0,1fr) auto;align-items:end;margin-bottom:14px}
    fieldset.profile-fields{min-width:0;border:0;margin:0;padding:0;display:grid;gap:8px 12px;grid-template-columns:repeat(2,minmax(0,1fr))}
    .profile-fields .wide{grid-column:1/-1}
    .profile-fields small{color:var(--muted);font-weight:400}
    .avatar{display:block;width:60px;height:60px;object-fit:cover;border-radius:50%;background:var(--bg)}
    .user .avatar{width:42px;height:42px}
    #topMembers{padding-left:24px;margin-bottom:0;line-height:1.7;overflow-wrap:anywhere}
    @media(max-width:465px){fieldset.profile-fields{grid-template-columns:1fr} #accountSearch{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><a href="./">← Расписание БашГАУ</a></header>
  <main>
    <h1>Аккаунт</h1>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <section id="authPanel" hidden>
      <div class="buttons" role="group" aria-label="Аккаунт">
        <button type="button" data-auth-mode="login" aria-pressed="true">Вход</button>
        <button type="button" data-auth-mode="signup" aria-pressed="false">Регистрация</button>
      </div>
      <form id="authForm">
        <label id="emailLabel">Электронная почта
          <input id="authEmail" name="email" type="email" maxlength="254" autocomplete="email" required>
        </label>
        <label id="passwordLabel">Пароль
          <input id="authPassword" name="password" type="password" autocomplete="current-password" required>
        </label>
        <fieldset id="signupFields" class="profile-fields" disabled hidden></fieldset>
        <button class="primary" id="authSubmit" type="submit">Войти</button>
      </form>
      <p><button id="recoveryButton" type="button">Забыли пароль?</button></p>
    </section>
    <section id="profile" hidden>
      <div class="profile-head">
        <div><h2 id="profileRole"></h2><p id="profileEmail"></p></div>
        <button id="signOut" type="button">Выйти</button>
      </div>
    </section>
    <section id="profileSettings" hidden>
      <h2>Настройки профиля</h2>
      <p id="ownNickname"></p>
      <form id="profileForm">
        <fieldset id="settingsFields" class="profile-fields"></fieldset>
        <button class="primary" id="profileSave" type="submit">Сохранить профиль</button>
      </form>
      <form id="avatarForm" hidden>
        <img id="profileAvatar" class="avatar" alt="Ваш аватар" hidden>
        <label>Аватар<input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp"></label>
        <div class="buttons">
          <button id="uploadAvatar" type="submit">Загрузить аватар</button>
          <button id="removeAvatar" type="button" hidden>Убрать аватар</button>
        </div>
      </form>
    </section>
    <section id="adminPanel" hidden>
      <h2>Управление пользователями</h2>
      <p><a href="./">Редактировать пару в расписании</a> — откройте нужную пару и нажмите «Редактировать пару».</p>
      <form id="accountSearch">
        <label>Поиск по имени, почте или группе<input id="searchEmail" type="search" maxlength="254"></label>
        <button type="submit">Найти</button>
      </form>
      <p id="listStatus" role="status"></p>
      <div id="accounts"></div>
      <div class="buttons" id="paging" hidden>
        <button id="prevPage" type="button">Назад</button>
        <button id="nextPage" type="button">Далее</button>
      </div>
    </section>
    <section aria-labelledby="topTitle">
      <h2 id="topTitle">Топ-5 по посещениям</h2>
      <p id="topStatus" role="status"></p>
      <ol id="topMembers"></ol>
    </section>
  </main>
  <template id="profileFields">
    <label>Фамилия<input name="last_name" autocomplete="family-name" maxlength="80" required></label>
    <label>Имя<input name="first_name" autocomplete="given-name" maxlength="80" required></label>
    <label>Отчество, если есть<input name="patronymic" autocomplete="additional-name" maxlength="80"></label>
    <label>Курс<select name="course" required></select></label>
    <label>Группа<select name="group_key" required></select></label>
    <label>Подгруппа<select name="subgroup" required></select></label>
    <label class="wide">Псевдоним для топа, по желанию
      <input name="nickname" maxlength="24" minlength="2">
      <small>Если поле пустое, сайт подставит нейтральный псевдоним.</small>
    </label>
  </template>
</body>
</html>
