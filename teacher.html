<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Моё расписание · БашГАУ</title>
  <link rel="icon" href="./icon-192.png">
  <script>
    try {
      if (JSON.parse(localStorage.getItem('bash_appearance_v1'))?.motion === false)
        document.documentElement.dataset.motion = 'off';
    } catch {}
  </script>
  <link rel="stylesheet" href="./account.css?v=2026-11-25.2">
  <script defer src="./vendor/supabase-2.119.2.js"></script>
  <script defer src="./supabase-client.js"></script>
  <script defer src="./teacher.js?v=2026-11-25.2"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><img src="./icon-192.png" width="36" height="36" alt="">Расписание БашГАУ</a>
    <a class="account-shortcut" href="./account.html" aria-label="Аккаунт" title="Аккаунт"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></a>
  </header>
  <main>
    <section>
      <h1>Моё расписание</h1>
      <p id="teacherName"></p>
      <p class="daily-traffic" aria-live="off"><strong data-i18n="trafficToday">Сегодня на сайте</strong> <span><span data-i18n="trafficUsers">Пользователей</span> · <b data-users>…</b></span> <span><span data-i18n="trafficVisits">Посещений</span> · <b data-visits>…</b></span></p>
      <div class="teacher-week">
        <label>Учебная неделя<select id="teacherWeek" disabled></select></label>
        <button id="addLesson" class="primary" type="button" hidden>Добавить пару</button>
      </div>
      <p id="teacherStatus" role="status">Загружаем расписание…</p>
    </section>
    <div id="teacherDays" class="teacher-days"></div>
    <dialog id="lessonDialog" class="lesson-editor" aria-labelledby="lessonTitle">
      <h2 id="lessonTitle"></h2>
      <form id="lessonForm">
        <label id="lessonOfferingLabel">Предмет и группа<select id="lessonOffering"></select></label>
        <label>День недели<select name="day" id="lessonDay" required></select></label>
        <div class="lesson-time">
          <label>Номер пары<input name="slot" type="number" min="1" max="6" required></label>
          <label>Аудитория<input name="room" maxlength="120"></label>
          <label>Начало<input name="starts_at" type="time" required></label>
          <label>Конец<input name="ends_at" type="time" required></label>
        </div>
        <p id="lessonStatus" role="status"></p>
        <div class="buttons">
          <button class="primary" type="submit">Сохранить</button>
          <button id="closeLesson" type="button">Закрыть</button>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
